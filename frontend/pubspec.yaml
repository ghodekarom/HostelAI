name: hfcms_frontend
description: "Hostel Facility Complaint Management System - Flutter Multiplatform Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & HTTP
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.0.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Utilities & Models
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
