spring:
  application:
    name: hfcms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

server:
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: ${SECURITY_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    access-token-expiration-minutes: ${SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,https://hfcms.vercel.app}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-directory: ${STORAGE_LOCAL_DIRECTORY:./uploads/evidence}
    supabase:
      url: ${STORAGE_SUPABASE_URL:}
      key: ${STORAGE_SUPABASE_KEY:}
      bucket: ${STORAGE_SUPABASE_BUCKET:hfcms-evidence}
  email:
    provider: ${EMAIL_PROVIDER:mailpit}
    from: ${MAIL_FROM_ADDRESS:no-reply@hfcms.internal}
    resend-api-key: ${RESEND_API_KEY:}
  ai:
    provider: ${AI_PROVIDER:anthropic}
    mock-enabled: ${AI_MOCK_ENABLED:true}
    api-key: ${AI_ANTHROPIC_API_KEY:}
    model: ${AI_ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
    timeout-ms: ${AI_TIMEOUT_MS:10000}
    max-retries: ${AI_MAX_RETRIES:2}
